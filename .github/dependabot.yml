version: 2

updates:
  # forge-std and openzeppelin-contracts are git submodules. Bumping them by hand is how the
  # working tree ends up with stray pointer changes sitting uncommitted next to real work;
  # as PRs they are at least reviewable and attributable.
  #
  # OpenZeppelin bumps are not routine here: MorphoLeverageVault inherits ERC4626 and
  # Ownable2Step, and _decimalsOffset() is load-bearing for the inflation-attack mitigation.
  # Read the changelog, then check test/unit/InflationAttack.t.sol still passes.
  - package-ecosystem: gitsubmodule
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"

  - package-ecosystem: npm
    directory: "/allocator"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      # viem and abitype move together, and abitype defines the Address type the config
      # schema normalises against. Splitting them across PRs just means two red builds.
      viem:
        patterns: ["viem", "abitype"]
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
